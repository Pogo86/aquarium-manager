name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/aquarium_manager
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print("OK", path)
          PY
      - name: Check frontend JavaScript syntax
        run: node --check custom_components/aquarium_manager/frontend/aquarium-manager-card.js
